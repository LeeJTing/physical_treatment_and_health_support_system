name: physical_treatment_and_health_support_system
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
#  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.9.1
  http: ^1.4.0
  # Phase 6: record or pick the exercise clip, and read its length and size before upload
  camera: ^0.11.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  # Phase 4: exercise reminders scheduled on the device (Asia/Kuala_Lumpur)
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  # Spoken exercise cues in the guide and while recording (Elwin, 23 Oct)
  flutter_tts: ^4.2.5
  # M200: blood pressure, glucose and weight from Health Connect (Jun Ting)
  health: ^13.1.0
  # M700: check and reduce the meal photo before upload (UC800 C3, C4), pure Dart
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only fakes of the camera and gallery plugins for recording_view tests; the versions
  # already locked through camera and image_picker (audit, 24 Oct).
  camera_platform_interface: 2.14.0
  image_picker_platform_interface: 2.11.2

#flutter_launcher_icons:
#  android: true
#  ios: true
#  image_path: "assets/images/appIcon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/seed/catalogue.json
    # Food catalogue of M700 (same file as the AI server's app/food/food_catalogue.json)
    - assets/seed/food_catalogue.json
    # Guide animations, one per exercise (training/build_guide_animations.py)
    - assets/guides/
    # Hand-written guide text per exercise: steps, captions, safety, mistakes (guide walkthrough)
    - assets/guides/coaching/
    # Terms of Use and Privacy Notice, English and Malay (TermsView)
    - assets/legal/terms.json
