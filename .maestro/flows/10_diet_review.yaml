appId: com.physical_treatment_and_health_support_system.tarumt.physical_treatment_and_health_support_system.e2e
name: ACD seeded weekly review and meal-reading patterns
tags: [ACD, M700]
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- tapOn: '(?s)Diet.*'
- scrollUntilVisible:
    element:
      text: '(?s).*Diet review.*'
    direction: DOWN
- tapOn: '(?s).*Diet review.*'
- assertVisible: Your recorded week
- assertVisible: '(?s).*[1-7] of.*elapsed days.*'
- takeScreenshot: acd-weekly-review
- tapOn: Meal & readings
- assertVisible: Patterns in your records
- assertVisible: '(?s).*Rank association:.*'
- takeScreenshot: acd-post-meal-pattern
- scrollUntilVisible:
    element:
      text: Recorded sodium and next-morning pressure
    direction: DOWN
- takeScreenshot: acd-next-morning-pressure
