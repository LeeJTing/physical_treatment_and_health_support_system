appId: com.physical_treatment_and_health_support_system.tarumt.physical_treatment_and_health_support_system.e2e
---
- scrollUntilVisible:
    element:
      text: Add food to breakfast
    direction: DOWN
    timeout: 60000
- tapOn: Add food to breakfast
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: food-search
      - eraseText: 10
      - inputText: papaya
      - pressKey: enter
      - assertVisible:
          id: food-search
          text: papaya
- tapOn: '(?s)Fruit.*Papaya.*'
- tapOn: Add to draft
